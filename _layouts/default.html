<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/newsreader-latin.woff2' | relative_url }}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/archivo-latin.woff2' | relative_url }}" crossorigin>
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include site-header.html %}
  <main class="page">
    <div class="reading">
      {%- if page.eyebrow %}
      <header class="page-head">
        <p class="eyebrow">{{ page.eyebrow }}</p>
        <h1>{{ page.heading | default: page.title }}</h1>
        {%- if page.dek %}
        <p class="dek">{{ page.dek }}</p>
        {%- endif %}
      </header>
      {%- endif %}
      {{ content }}
    </div>
  </main>
  {% include site-footer.html %}
  {% include analytics.html %}
</body>
</html>
